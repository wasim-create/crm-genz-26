<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexDrive CRM - Next-Gen US Dealership Field Sales</title>
    <meta name="description" content="Next-generation field sales CRM for US car dealership supplier teams with intelligent route planning, role-gated pipeline, Google Workspace integration, and executive intelligence." />
    <meta property="og:title" content="ApexDrive CRM - Next-Gen US Dealership Field Sales" />
    <meta property="og:description" content="Next-generation field sales CRM for US car dealership supplier teams with intelligent route planning, role-gated pipeline, Google Workspace integration, and executive intelligence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set light/dark before the page paints so there is no white flash.
      (function () {
        try {
          var p = localStorage.getItem('apexdrive_theme');
          var m = window.matchMedia;
          var dark = m && m('(prefers-color-scheme: dark)').matches;
          var light = m && m('(prefers-color-scheme: light)').matches;
          var h = new Date().getHours();
          var isDark = p === 'dark' || (p !== 'light' && (dark || (!light && (h >= 19 || h < 7))));
          var c = document.documentElement.classList;
          c.add(isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">

  </body>
</html>
